name: Validate Facebook publishing branch

on:
  push:
    branches:
      - feat/facebook-page-publishing-v33-2-21
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Install template parser and image processor
        run: python -m pip install --disable-pip-version-check Jinja2 "Pillow>=10.0,<13.0" "google-genai>=1.0.0" "python-dotenv>=1.0.0"
      - name: Compile Python source
        run: python -m py_compile app/main.py app/ai/gemini.py app/ai/plate_privacy.py app/ai/text_inference.py app/photo_categories.py app/series_publication.py app/meta_rate_limit.py app/publication_split.py app/time_utils.py gunicorn.conf.py
      - name: Run offline plate-privacy unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate integration invariants and Jinja templates
        run: python scripts/check_facebook_integration.py
