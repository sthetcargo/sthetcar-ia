name: Validate Facebook publishing branch

on:
  push:
    branches:
      - feat/facebook-page-publishing-v33-2-21
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install template parser
        run: python -m pip install --disable-pip-version-check Jinja2
      - name: Compile Python source
        run: python -m py_compile app/main.py
      - name: Validate integration invariants and Jinja template
        run: python scripts/check_facebook_integration.py
